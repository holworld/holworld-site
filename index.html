<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Legends · Opening soon</title>
<meta name="description" content="House of Legends, a house for the Bengal School and the art of Santiniketan, opens in South Delhi on 1 December 2026.">
<meta name="robots" content="noindex">
<meta property="og:title" content="House of Legends">
<meta property="og:description" content="A house for the Bengal School and the art of Santiniketan. Opening in South Delhi on 1 December 2026.">
<meta property="og:image" content="https://holworld.com/assets/img/og-card.png">
<meta name="theme-color" content="#1E3A31">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Hanken+Grotesk:wght@400;500&amp;family=Montserrat:wght@700&amp;display=swap">
<style>
:root{--wall:#1E3A31;--wall-deep:#15291F;--on-wall:#F1EFE8;--muted:#B8C2B9;--brass:#CDAE6E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100svh;background:var(--wall);color:var(--on-wall);font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.6;display:flex;flex-direction:column;overflow-x:hidden;position:relative}
.motif{position:absolute;pointer-events:none;background:var(--brass);-webkit-mask:url(/assets/img/motifs/alpana.svg) center/contain no-repeat;mask:url(/assets/img/motifs/alpana.svg) center/contain no-repeat}
.m1{width:min(900px,120vw);aspect-ratio:1;right:-22%;top:-18%;opacity:.1}
.m2{width:min(420px,70vw);aspect-ratio:1;left:-12%;bottom:-14%;opacity:.07}
header,main,footer{position:relative;width:100%;max-width:1240px;margin:0 auto;padding-inline:20px}
header{padding-block:28px}
header img{height:64px;width:auto;display:block}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:48px 72px}
.mk{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0}
h1{font-family:"Libre Caslon Display",Didot,"Bodoni 72",Georgia,serif;font-weight:400;font-size:clamp(52px,8vw,112px);line-height:1;letter-spacing:-.01em;margin:0;max-width:9em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.lede{font-size:21px;line-height:1.55;color:var(--muted);max-width:30em}
a{color:var(--brass);font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
a:hover{color:var(--on-wall)}
a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
footer{padding-block:24px 32px;border-top:1px solid #2B3631;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between}
@media (max-width:600px){header img{height:48px}.lede{font-size:18px}}
</style>
</head>
<body>
<div class="motif m1" aria-hidden="true"></div>
<div class="motif m2" aria-hidden="true"></div>
<header><img src="/assets/img/logo/hol-logo-white.svg" alt="House of Legends"></header>
<main>
<p class="mk">Opening 1 December 2026 · South Delhi</p>
<h1>The paint is still drying.</h1>
<p class="lede">We are hanging the walls of a house for the Bengal School and the art of Santiniketan. The doors open soon. Until then, write to us at <a href="mailto:hello@holworld.com">hello@holworld.com</a>.</p>
</main>
<footer><p>House of Legends, South Delhi</p><p>© 2026 House of Legends</p></footer>
</body>
</html>
